[package]
name = "leake"
version = "1.0.0"
edition = "2024"
description = "Converts images, animated GIFs, and videos into Source Engine spray textures"
license = "GPLv3"

[lints.clippy]
pedantic = "warn"
style = "warn"
many_single_char_names = "warn"
min_ident_chars = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = "0.25.10"
rayon = "1.12.0"

[dev-dependencies]
sha2 = "0.10.9"
tempfile = "3.27.0"
